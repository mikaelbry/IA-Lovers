<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Post</title>
    <link rel="shortcut icon" href="assets/images/logo.png" />
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/post.css">
    <link rel="stylesheet" href="assets/css/header.css">
</head>
<body>

<nav class="navbar"></nav>

<section class="feed post-detail-page">
    <div id="post"></div>
    <div id="comments"></div>
</section>

<button class="back-btn back-btn-floating" type="button" onclick="goBack()">← Volver</button>

<script src="assets/js/header.js?v=20260405-3"></script>
<script>
const params = new URLSearchParams(window.location.search);
const postId = params.get('id');
const token = localStorage.getItem('token');
const storedUser = JSON.parse(localStorage.getItem('user') || 'null');

let allComments = [];
let commentStack = [];

function formatDate(dateString) {
    const d = new Date(dateString);
    return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')} - ${d.getDate().toString().padStart(2, '0')}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getFullYear()}`;
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    }[char]));
}

function getInitial(value) {
    return escapeHtml(String(value || 'I').trim().charAt(0).toUpperCase() || 'I');
}

function renderUserAvatar(user, className) {
    const username = user?.username ?? '';

    if (user?.avatar_url) {
        return `<img src="${escapeHtml(user.avatar_url)}" alt="Avatar de ${escapeHtml(username)}" class="${className}">`;
    }

    return `<span class="${className} avatar-initial" aria-label="Avatar de ${escapeHtml(username)}">${getInitial(username)}</span>`;
}

function renderLikeIcon() {
    return `
        <svg class="post-action-icon like-icon-outline" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"></path>
        </svg>
        <svg class="post-action-icon like-icon-filled" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m12 21.35-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
        </svg>
    `;
}

function renderCommentIcon() {
    return `
        <svg class="post-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"></path>
        </svg>
    `;
}

function getProfileUrl(username) {
    if (storedUser && storedUser.username === username) {
        return publicUrl('profile.html');
    }

    return `${publicUrl('user.html')}?username=${encodeURIComponent(username)}`;
}

async function requestJson(url, options = {}) {
    return await window.requestApiJson(url, options);
}

async function loadPost() {
    if (!postId) {
        document.getElementById('post').innerHTML = '<p>Post no encontrado.</p>';
        return;
    }

    const data = await requestJson(apiUrl(`/posts/show?id=${encodeURIComponent(postId)}`), {
        headers: token ? { Authorization: 'Bearer ' + token } : {}
    });

    const post = data.post;
    const tagsHTML = post.tags
        ? post.tags.split(',').map(tag => `
            <span class="tag" onclick="goToTag('${encodeURIComponent(tag.trim())}', event)">#${escapeHtml(tag.trim())}</span>
        `).join('')
        : '';

    document.getElementById('post').innerHTML = `
        <article class="post-detail-card">
            <div class="post-menu">
                <button type="button" class="menu-btn" onclick="toggleMenu(event, ${post.id})">...</button>
                <div class="menu-dropdown" id="menu-${post.id}">
                    <div class="menu-item" id="copy-${post.id}" onclick="copyPostLink(${post.id}, event)">
                        Compartir
                    </div>
                    ${
                        storedUser && storedUser.username === post.username
                            ? `<div class="menu-item delete" onclick="openDeletePostDialog(${post.id}, event)">Eliminar</div>`
                            : ``
                    }
                </div>
            </div>

            <div class="post-detail-header">
                <a href="${getProfileUrl(post.username)}" class="post-detail-author-link">
                    ${renderUserAvatar(post, 'post-detail-avatar')}
                    <div class="post-detail-author-meta">
                        <h2>${escapeHtml(post.username)}</h2>
                        <div class="post-meta">${formatDate(post.created_at)}</div>
                    </div>
                </a>
            </div>

            <img src="${escapeHtml(post.file_path)}" class="post-image2" alt="${escapeHtml(post.title)}">

            <div class="post-title">${escapeHtml(post.title)}</div>
            <div class="post-description">${escapeHtml(post.description ?? '')}</div>
            <div class="post-tags">${tagsHTML}</div>
            <div class="post-actions post-detail-actions">
                <button id="likeBtn" type="button" class="like-btn ${post.liked_by_user == 1 ? 'liked' : ''}" onclick="toggleLike()">
                    ${renderLikeIcon()} <span id="likeCount">${post.likes_count}</span>
                </button>
                <span id="commentCount" class="comment-count comment-count-static">${renderCommentIcon()} <span>${post.comments_count}</span></span>
            </div>
        </article>
    `;

    allComments = Array.isArray(data.comments) ? data.comments : [];

    const activeThreadId = commentStack[commentStack.length - 1] || null;
    renderComments(activeThreadId);
}

async function toggleLike() {
    if (!token) {
        window.location.href = 'login.html';
        return;
    }

    const btn = document.getElementById('likeBtn');
    const countEl = document.getElementById('likeCount');
    const previousLiked = btn.classList.contains('liked');
    const previousCount = parseInt(countEl.textContent, 10) || 0;
    const nextLiked = !previousLiked;
    const nextCount = Math.max(0, previousCount + (nextLiked ? 1 : -1));

    btn.classList.toggle('liked', nextLiked);
    countEl.textContent = nextCount;

    try {
        const data = await requestJson(apiUrl('/posts/toggle-like'), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + token
            },
            body: JSON.stringify({ post_id: postId })
        });

        if (data.liked !== nextLiked) {
            btn.classList.toggle('liked', data.liked);
            countEl.textContent = Math.max(0, previousCount + (data.liked ? 1 : -1));
        }
    } catch (error) {
        btn.classList.toggle('liked', previousLiked);
        countEl.textContent = previousCount;

        if (error.authRedirected) {
            return;
        }
        alert(error.message);
    }
}

function toggleMenu(event, id) {
    event.preventDefault();
    event.stopPropagation();

    document.querySelectorAll('.menu-dropdown').forEach(menu => {
        if (menu.id !== 'menu-' + id) {
            menu.classList.remove('active');
        }
    });

    document.getElementById('menu-' + id)?.classList.toggle('active');
}

document.addEventListener('click', () => {
    document.querySelectorAll('.menu-dropdown')
        .forEach(menu => menu.classList.remove('active'));
});

function copyPostLink(id, event) {
    event.preventDefault();
    event.stopPropagation();

    const url = `${window.location.origin}${publicUrl('post.html')}?id=${id}`;
    navigator.clipboard.writeText(url);

    const el = document.getElementById(`copy-${id}`);
    if (!el) {
        return;
    }

    el.textContent = 'Enlace copiado al portapapeles';
    el.style.color = 'green';

    setTimeout(() => {
        el.textContent = 'Compartir';
        el.style.color = '';
    }, 2000);
}

function openDeletePostDialog(id, event) {
    event?.preventDefault();
    event?.stopPropagation();
    document.querySelectorAll('.menu-dropdown')
        .forEach(menu => menu.classList.remove('active'));

    document.getElementById('deletePostDialog')?.remove();

    const dialog = document.createElement('div');
    dialog.id = 'deletePostDialog';
    dialog.className = 'post-delete-dialog-backdrop';
    dialog.innerHTML = `
        <div class="post-delete-dialog" role="dialog" aria-modal="true" aria-labelledby="deletePostTitle">
            <h3 id="deletePostTitle">Eliminar publicacion</h3>
            <p>Estas seguro de que deseas borrar esta publicacion? Esta accion es irreversible.</p>
            <div class="post-delete-dialog-actions">
                <button type="button" class="post-delete-cancel" onclick="closeDeletePostDialog()">Cancelar</button>
                <button type="button" class="post-delete-confirm" onclick="deletePost(${id})">Eliminar</button>
            </div>
        </div>
    `;

    dialog.addEventListener('click', event => {
        if (event.target === dialog) {
            closeDeletePostDialog();
        }
    });

    document.body.appendChild(dialog);
}

function closeDeletePostDialog() {
    document.getElementById('deletePostDialog')?.remove();
}

async function deletePost(id) {
    try {
        const data = await requestJson(apiUrl('/posts/delete'), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + token
            },
            body: JSON.stringify({ post_id: id })
        });

        if (data.success) {
            closeDeletePostDialog();
            window.history.back();
            return;
        }

        alert(data.error || 'Error al eliminar');
    } catch (error) {
        if (error.authRedirected) {
            return;
        }
        alert(error.message);
    }
}

function buildTree(comments) {
    const map = {};
    const roots = [];

    comments.forEach(comment => {
        map[comment.id] = { ...comment, children: [] };
    });

    Object.values(map).forEach(comment => {
        if (comment.parent_id && map[comment.parent_id]) {
            map[comment.parent_id].children.push(comment);
        } else {
            roots.push(comment);
        }
    });

    return roots;
}

function flattenComments(comment, map) {
    map[comment.id] = comment;
    comment.children.forEach(child => flattenComments(child, map));
}

function countAllDescendants(comment) {
    let count = comment.children.length;
    comment.children.forEach(child => {
        count += countAllDescendants(child);
    });
    return count;
}

function renderComments(parentId) {
    const container = document.getElementById('comments');
    const tree = buildTree(allComments);

    container.innerHTML = `
        <section class="comments-section">
            <div class="comments-topbar">
                <h3>Comentarios</h3>
                ${commentStack.length > 0 ? '<button type="button" class="reply-back" onclick="goBackComment()">← Volver al hilo anterior</button>' : ''}
            </div>
            <div id="commentsBody"></div>
        </section>
    `;

    const commentsBody = document.getElementById('commentsBody');
    let commentsToRender = tree;

    if (parentId) {
        const flatMap = {};
        tree.forEach(root => flattenComments(root, flatMap));

        const parentComment = flatMap[parentId];
        commentsToRender = parentComment ? parentComment.children : [];

        if (parentComment) {
            const parentDiv = renderSingleComment(parentComment, true);
            commentsBody.appendChild(parentDiv);
            if (!parentComment.is_deleted) {
                renderFormAfter(parentDiv, parentId);
            }
        }
    } else {
        renderForm(commentsBody, null, true);
    }

    commentsToRender.forEach(comment => {
        commentsBody.appendChild(renderSingleComment(comment, false));
    });
}

function renderSingleComment(comment, isParent = false) {
    const div = document.createElement('div');
    const isDeleted = Boolean(comment.is_deleted);
    div.className = `comment ${isParent ? 'comment-parent-focus' : ''} ${isDeleted ? 'comment-deleted' : ''}`;

    const descendants = countAllDescendants(comment);
    const authorUrl = !isDeleted ? getProfileUrl(comment.username) : '';
    const canDelete = !isDeleted && storedUser && Number(storedUser.id) === Number(comment.user_id);
    const authorHtml = isDeleted
        ? `
            <div class="comment-author-link comment-deleted-author" aria-label="Comentario borrado">
                <span class="comment-avatar comment-deleted-avatar" aria-hidden="true"></span>
                <div>
                    <strong>Comentario borrado</strong>
                    <div class="comment-date">${formatDate(comment.created_at)}</div>
                </div>
            </div>
        `
        : `
            <a href="${authorUrl}" class="comment-author-link">
                ${renderUserAvatar(comment, 'comment-avatar')}
                <div>
                    <strong>${escapeHtml(comment.username)}</strong>
                    <div class="comment-date">${formatDate(comment.created_at)}</div>
                </div>
            </a>
        `;

    div.innerHTML = `
        <div class="comment-header">
            ${authorHtml}
            ${
                canDelete
                    ? `<button type="button" class="comment-delete-btn" onclick="openDeleteCommentDialog(${comment.id}, event)">Eliminar</button>`
                    : ``
            }
        </div>
        <p>${isDeleted ? 'Comentario borrado' : escapeHtml(comment.content)}</p>
        <div class="comment-actions">
            ${!isDeleted ? `<button type="button" onclick="enterThread(${comment.id})">Responder</button>` : ''}
            ${descendants > 0 ? `<span class="view-replies" onclick="enterThread(${comment.id})">${descendants} respuestas</span>` : ''}
        </div>
    `;

    return div;
}

function openDeleteCommentDialog(id, event) {
    event?.preventDefault();
    event?.stopPropagation();

    document.getElementById('deleteCommentDialog')?.remove();

    const dialog = document.createElement('div');
    dialog.id = 'deleteCommentDialog';
    dialog.className = 'post-delete-dialog-backdrop';
    dialog.innerHTML = `
        <div class="post-delete-dialog" role="dialog" aria-modal="true" aria-labelledby="deleteCommentTitle">
            <h3 id="deleteCommentTitle">Eliminar comentario</h3>
            <p>Estas seguro de que deseas borrar este comentario?</p>
            <div class="post-delete-dialog-actions">
                <button type="button" class="post-delete-cancel" onclick="closeDeleteCommentDialog()">Cancelar</button>
                <button type="button" class="post-delete-confirm" onclick="deleteComment(${id})">Eliminar</button>
            </div>
        </div>
    `;

    dialog.addEventListener('click', event => {
        if (event.target === dialog) {
            closeDeleteCommentDialog();
        }
    });

    document.body.appendChild(dialog);
}

function closeDeleteCommentDialog() {
    document.getElementById('deleteCommentDialog')?.remove();
}

async function deleteComment(id) {
    if (!token) {
        window.location.href = 'login.html';
        return;
    }

    try {
        const data = await requestJson(apiUrl('/comments/delete'), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + token
            },
            body: JSON.stringify({ comment_id: id })
        });

        if (data.deleted) {
            closeDeleteCommentDialog();
            if (data.mode === 'hard') {
                commentStack = commentStack.filter(commentId => Number(commentId) !== Number(id));
            }
            await loadPost();
            return;
        }

        alert(data.error || 'Error al eliminar');
    } catch (error) {
        if (error.authRedirected) {
            return;
        }
        alert(error.message);
    }
}

function renderForm(container, parentId, isRoot = false) {
    const form = document.createElement('div');
    form.className = 'comment-form';
    form.innerHTML = `
        <textarea id="commentInput" placeholder="Escribe un comentario..."></textarea>
        <button type="button" onclick="addComment(${parentId === null ? 'null' : parentId})">Comentar</button>
    `;

    if (isRoot) {
        container.prepend(form);
    } else {
        container.appendChild(form);
    }
}

function renderFormAfter(commentDiv, parentId) {
    const form = document.createElement('div');
    form.className = 'comment-form';
    form.innerHTML = `
        <textarea id="commentInput" placeholder="Escribe un comentario..."></textarea>
        <button type="button" onclick="addComment(${parentId})">Comentar</button>
    `;
    commentDiv.after(form);
}

function enterThread(commentId) {
    commentStack.push(commentId);
    renderComments(commentId);
}

function goBackComment() {
    commentStack.pop();
    renderComments(commentStack[commentStack.length - 1] || null);
}

async function addComment(parentId = null) {
    if (!token) {
        window.location.href = 'login.html';
        return;
    }

    const input = document.querySelector('#commentInput');
    const content = input?.value.trim();

    if (!content) {
        return;
    }

    try {
        await requestJson(apiUrl('/comments/create'), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + token
            },
            body: JSON.stringify({ post_id: postId, content, parent_id: parentId })
        });

        await loadPost();
    } catch (error) {
        if (error.authRedirected) {
            return;
        }
        alert(error.message);
    }
}

function goBack() {
    window.history.back();
}

function goToTag(tag, event) {
    event.stopPropagation();
    window.location.href = `${publicUrl('explorar.html')}?q=${tag}`;
}

loadPost().catch(error => {
    if (error.authRedirected) {
        return;
    }
    alert(error.message);
});
</script>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
