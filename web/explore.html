<!DOCTYPE html>
<!-- Exploración pública: buscador, categorías destacadas y feed paginado. -->
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Explorar</title>
        <link rel="shortcut icon" href="assets/images/logo.png" />
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/post.css">
        <link rel="stylesheet" href="assets/css/header.css">
        <style>
            .explore-filters{
                position: fixed;
                left: 40px;
                bottom: 40px;
                z-index: 20;
            }

            .filter-toggle{
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                background: #2481ce;
                color: white;
                padding: 12px 20px;
                border-radius: 12px;
                cursor: pointer;
                font-weight: 600;
                font-size: 15px;
                box-shadow: 0 4px 15px rgba(36, 129, 206, 0.3);
                transition: all 0.3s ease;
                width: fit-content;
            }

            .filter-toggle:hover{
                background: #1a6fb5;
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(36, 129, 206, 0.4);
            }

            .filter-toggle-arrow{
                transition: transform 0.3s ease;
            }

            .filter-toggle.open .filter-toggle-arrow{
                transform: rotate(180deg);
            }

            .filter-content{
                position: absolute;
                bottom: 60px;
                left: 0;
                background: #fff;
                padding: 20px;
                border-radius: 12px;
                border: 1px solid #e6e6e6;
                width: 280px;
                box-sizing: border-box;
                display: none;
                flex-direction: column;
                gap: 15px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
                animation: slideUp 0.3s ease;
            }

            .filter-content.open{
                display: flex;
            }

            @keyframes slideUp{
                from{
                    opacity: 0;
                    transform: translateY(10px);
                }
                to{
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .filter-content input,
            .filter-content select,
            .filter-content button{
                width: 100%;
                box-sizing: border-box;
            }

            .filter-content input,
            .filter-content select{
                padding: 10px;
                border-radius: 6px;
                border: 1px solid #2481ce;
            }

            .filter-content button{
                padding: 10px;
                border-radius: 6px;
                border: none;
                background: #2481ce;
                color: white;
                cursor: pointer;
                transition: background 0.2s;
            }

            .filter-content button:hover{
                background: #1a6fb5;
            }

            .filter-buttons{
                display: flex;
                gap: 10px;
            }

            .filter-buttons button{
                flex: 1;
            }

            .filter-buttons button:first-child{
                background: #e74c3c;
            }

            .filter-buttons button:first-child:hover{
                background: #c0392b;
            }

            .filter-buttons button:last-child{
                background: #2481ce;
            }

            .filter-buttons button:last-child:hover{
                background: #1a6fb5;
            }

            .explore-header{
                margin-bottom:30px;
            }

            .post-date{
                font-size:13px;
                color:#777;
                margin-bottom:8px;
            }

            @media(max-width:1280px){
                .explore-filters{
                    position: static;
                    width: 100%;
                    margin-bottom: 20px;
                }

                .filter-toggle{
                    width: 100%;
                    box-sizing: border-box;
                }

                .filter-content{
                    position: static;
                    width: 100%;
                    box-sizing: border-box;
                    box-shadow: none;
                    border: none;
                    padding: 0;
                    animation: none;
                }

                .filter-content.open{
                    display: flex;
                    margin-top: 15px;
                }

                .filter-buttons button:last-child{
                    background: #2481ce;
                }

                .filter-buttons button:last-child:hover{
                    background: #1a6fb5;
                }

                .filter-buttons button:first-child{
                    background: #e74c3c;
                }

                .filter-buttons button:first-child:hover{
                    background: #c0392b;
                }
            }

            @media(max-width:640px){
                .feed{
                    margin: 24px auto;
                    padding: 0 12px;
                    box-sizing: border-box;
                }

                .explore-filters{
                    left: 12px;
                    right: 12px;
                    bottom: 20px;
                }

                .filter-toggle{
                    padding: 12px 16px;
                    font-size: 14px;
                }
            }
        </style>
    </head>
    <body>
        <nav class="navbar"></nav>
        <section class="feed">
            <div class="explore-filters">
                <div class="filter-toggle" onclick="toggleFilters()">
                    <span>Filtros</span>
                    <span class="filter-toggle-arrow">▼</span>
                </div>
                <div class="filter-content">
                    <input type="text" id="searchQuery" placeholder="Buscar por titulo o tag">
                    <select id="orderSelect">
                        <option value="recent">Más recientes</option>
                        <option value="likes">Más likes</option>
                    </select>
                    <div class="filter-buttons">
                        <button id="clearFiltersBtn" onclick="clearFilters()" style="display:none;">
                            Quitar filtros
                        </button>
                        <button onclick="applyFilters()">Aplicar filtros</button>
                    </div>
                </div>
            </div>

            <div id="posts"></div>
        </section>
        <script src="assets/js/header.js?v=20260326-2"></script>
        <script src="assets/js/posts.js?v=20260326-2"></script>
        <script>
            /**
             * Controlador de la página Explorar.
             * Conecta filtros visuales, búsqueda, etiquetas rápidas y feed paginado.
             */
            function toggleFilters(){
                const toggle = document.querySelector('.filter-toggle');
                const content = document.querySelector('.filter-content');
                toggle.classList.toggle('open');
                content.classList.toggle('open');
            }

            document.addEventListener('click', function(e){
                const filters = document.querySelector('.explore-filters');
                if(!filters.contains(e.target) && document.querySelector('.filter-content.open')){
                    document.querySelector('.filter-toggle').classList.remove('open');
                    document.querySelector('.filter-content').classList.remove('open');
                }
            });

            function buildURL(cursor){

                const q = document.getElementById("searchQuery").value;
                const order = document.getElementById("orderSelect").value;

                let url = `${apiUrl("/posts")}?type=explore&q=${encodeURIComponent(q)}&order=${order}`;

                if(cursor){
                    url += `&cursor=${cursor}`;
                }

                if(order === "likes" && cursorLikes !== null){
                    url += `&cursor_likes=${cursorLikes}`;
                }

                return url;
            }

            function applyFilters(){

                const q = document.getElementById("searchQuery").value;
                const order = document.getElementById("orderSelect").value;

                const params = new URLSearchParams();

                if(q) params.set("q", q);
                if(order && order !== "recent") params.set("order", order);

                history.replaceState(null, "", "?" + params.toString());

                updateClearButton();
                resetAndLoad(buildURL, "posts");
            }

            function clearFilters(){

                document.getElementById("searchQuery").value = "";
                document.getElementById("orderSelect").value = "recent";

                history.replaceState(null, "", window.location.pathname);

                updateClearButton();
                resetAndLoad(buildURL, "posts");
            }

            function updateClearButton(){

                const q = document.getElementById("searchQuery").value;
                const order = document.getElementById("orderSelect").value;

                const btn = document.getElementById("clearFiltersBtn");

                if(q || order !== "recent"){
                    btn.style.display = "block";
                }else{
                    btn.style.display = "none";
                }
            }

            function loadFiltersFromURL(){

                const params = new URLSearchParams(window.location.search);

                const q = params.get("q");
                const order = params.get("order");

                if(q) document.getElementById("searchQuery").value = q;
                if(order) document.getElementById("orderSelect").value = order;
            }

            document.getElementById("searchQuery").addEventListener("input", updateClearButton);
            document.getElementById("orderSelect").addEventListener("change", updateClearButton);

            loadFiltersFromURL();
            updateClearButton();
            initInfiniteScroll(buildURL,"posts");
        </script>
        <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    </body>
</html>
